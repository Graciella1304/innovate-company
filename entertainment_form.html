<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entertainment Registration Form</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --gold: #c9a84c;
    --deep: #0d0a1a;
    --surface: #13102a;
    --card: #1a1635;
    --text: #f0eaff;
    --muted: #7a6fa8;
    --accent: #e040fb;
    --border: rgba(201,168,76,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--deep);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-fx {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 70% 20%, rgba(224,64,251,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 20% 80%, rgba(201,168,76,0.07) 0%, transparent 60%);
  }

  .container {
    position: relative; z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.8s ease both;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #f0eaff 0%, #c9a84c 60%, #e040fb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 300;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    margin-bottom: 24px;
    animation: fadeUp 0.7s ease both;
  }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.2s; }
  .card:nth-child(4) { animation-delay: 0.3s; }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--gold);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .row { display: grid; gap: 20px; }
  .row.two { grid-template-columns: 1fr 1fr; }

  .field { display: flex; flex-direction: column; gap: 8px; }

  label {
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  input, select, textarea {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    width: 100%;
    appearance: none;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.06);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }

  select option { background: var(--surface); }

  textarea { resize: vertical; min-height: 100px; }

  .checkbox-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .check-item:hover { border-color: var(--gold); background: rgba(201,168,76,0.06); }
  .check-item input[type=checkbox] {
    width: 16px; height: 16px; padding: 0;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .check-item span { font-size: 0.88rem; }

  .rating-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .rating-btn {
    flex: 1;
    min-width: 48px;
    padding: 10px 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .rating-btn:hover, .rating-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--deep);
    font-weight: 700;
  }

  .submit-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--gold), #e8c56d);
    border: none;
    border-radius: 14px;
    color: var(--deep);
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.3s;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
  }
  .submit-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,168,76,0.4); }
  .submit-btn:hover::after { opacity: 1; }
  .submit-btn:active { transform: translateY(0); }

  .success-msg {
    display: none;
    text-align: center;
    padding: 24px;
    background: rgba(201,168,76,0.08);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    margin-top: 16px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 500px) {
    .row.two { grid-template-columns: 1fr; }
    .checkbox-group { grid-template-columns: 1fr; }
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>

<div class="bg-fx"></div>

<div class="container">

  <div class="header">
    <div class="tag">Innovate Company Ltd</div>
    <h1>Entertainment<br>Registration Form</h1>
    <p class="subtitle">Fill in your details to register for entertainment services</p>
  </div>

  <!-- Personal Info -->
  <div class="card">
    <div class="section-title">Personal Information</div>
    <div class="row" style="gap:20px;">
      <div class="row two">
        <div class="field">
          <label>First Name</label>
          <input type="text" placeholder="e.g. Alpha">
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" placeholder="e.g. Crispin">
        </div>
      </div>
      <div class="row two">
        <div class="field">
          <label>Date of Birth</label>
          <input type="date">
        </div>
        <div class="field">
          <label>Gender</label>
          <select>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" placeholder="your@email.com">
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" placeholder="+250 7XX XXX XXX">
      </div>
    </div>
  </div>

  <!-- Entertainment Preferences -->
  <div class="card">
    <div class="section-title">Entertainment Preferences</div>
    <div class="row" style="gap:20px;">
      <div class="field">
        <label>Category of Interest</label>
        <select>
          <option value="">Select a category</option>
          <option>Music &amp; Concerts</option>
          <option>Movies &amp; Cinema</option>
          <option>Sports &amp; Games</option>
          <option>Theatre &amp; Drama</option>
          <option>Comedy Shows</option>
          <option>Art &amp; Exhibitions</option>
          <option>Gaming &amp; Esports</option>
          <option>Dance &amp; Performances</option>
        </select>
      </div>
      <div class="field">
        <label>Select Genres / Activities</label>
        <div class="checkbox-group">
          <label class="check-item"><input type="checkbox"><span>🎵 Music</span></label>
          <label class="check-item"><input type="checkbox"><span>🎬 Film</span></label>
          <label class="check-item"><input type="checkbox"><span>🎭 Theatre</span></label>
          <label class="check-item"><input type="checkbox"><span>🎮 Gaming</span></label>
          <label class="check-item"><input type="checkbox"><span>🏆 Sports</span></label>
          <label class="check-item"><input type="checkbox"><span>🎨 Art</span></label>
          <label class="check-item"><input type="checkbox"><span>😂 Comedy</span></label>
          <label class="check-item"><input type="checkbox"><span>💃 Dance</span></label>
        </div>
      </div>
      <div class="field">
        <label>Preferred Day(s)</label>
        <select>
          <option value="">Select preferred day</option>
          <option>Weekdays</option>
          <option>Weekends</option>
          <option>Any day</option>
        </select>
      </div>
      <div class="field">
        <label>Experience Level</label>
        <select>
          <option value="">Select level</option>
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Professional</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Membership & Rating -->
  <div class="card">
    <div class="section-title">Membership &amp; Feedback</div>
    <div class="row" style="gap:20px;">
      <div class="field">
        <label>Membership Type</label>
        <select>
          <option value="">Choose membership</option>
          <option>Free — Basic Access</option>
          <option>Standard — Monthly</option>
          <option>Premium — Annual</option>
          <option>VIP — Lifetime</option>
        </select>
      </div>
      <div class="field">
        <label>How did you hear about us?</label>
        <select>
          <option value="">Select source</option>
          <option>Social Media</option>
          <option>Friend / Family</option>
          <option>School / University</option>
          <option>Online Search</option>
          <option>Advertisement</option>
        </select>
      </div>
      <div class="field">
        <label>Rate your excitement (1–5)</label>
        <div class="rating-group" id="ratingGroup">
          <button class="rating-btn" onclick="setRating(this,1)">1 ⭐</button>
          <button class="rating-btn" onclick="setRating(this,2)">2 ⭐</button>
          <button class="rating-btn" onclick="setRating(this,3)">3 ⭐</button>
          <button class="rating-btn" onclick="setRating(this,4)">4 ⭐</button>
          <button class="rating-btn" onclick="setRating(this,5)">5 ⭐</button>
        </div>
      </div>
      <div class="field">
        <label>Additional Comments</label>
        <textarea placeholder="Tell us what entertainment experience you're looking for..."></textarea>
      </div>
    </div>
  </div>

  <button class="submit-btn" onclick="handleSubmit()">🎬 &nbsp; Submit Registration</button>
  <div class="success-msg" id="successMsg">🎉 Registration Successful! Welcome to the entertainment family.</div>

</div>

<script>
  function setRating(btn, val) {
    document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function handleSubmit() {
    const msg = document.getElementById('successMsg');
    msg.style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
</script>

</body>
</html>
